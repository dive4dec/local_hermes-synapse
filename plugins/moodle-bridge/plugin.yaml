name: moodle-bridge
version: 1.1.0
description: "Bridges Hermes sessions to Moodle: registers tools for uploading files to courses, querying user-enrolled courses, and auditing quiz integrity (in-process DB audit: fast completions, off-campus IPs). Reads user identity from $HERMES_HOME/.moodle_identity (written by the bridge) and Moodle's config.php for DB credentials."
author: dive4dec
requires_env:
  - MOODLE_CONFIG_PATH
pip_dependencies:
  - PyMySQL
