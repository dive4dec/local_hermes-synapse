name: moodle-bridge
version: 1.0.1
description: "Bridges Hermes sessions to Moodle: registers tools for uploading files to courses and querying user-enrolled courses. Reads user identity from $HERMES_HOME/.moodle_identity (written by the bridge) and Moodle's config.php for DB credentials."
author: dive4dec
requires_env:
  - MOODLE_CONFIG_PATH
pip_dependencies:
  - PyMySQL
